<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Skyline - Image Placeholder Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        h1 { color: #c77a2a; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        canvas {
            width: 100%;
            display: block;
        }
        .info {
            padding: 1rem;
        }
        .info h3 {
            margin: 0 0 0.5rem;
            font-size: 1rem;
            color: #333;
        }
        .info p {
            margin: 0;
            font-size: 0.875rem;
            color: #666;
        }
        .btn {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: #c77a2a;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
        }
        .btn:hover {
            background: #a5621f;
        }
        .instructions {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-left: 4px solid #c77a2a;
        }
        .instructions code {
            background: #f5f5f5;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>🖼️ Skyline Solution Enterprises - Image Placeholders</h1>
    
    <div class="instructions">
        <h3>📋 Instructions:</h3>
        <ol>
            <li>Click "Download" on each placeholder image below</li>
            <li>Save to: <code>assets/img/[filename]</code></li>
            <li>Replace with actual images when ready</li>
            <li>See <code>IMAGE-REQUIREMENTS.md</code> for AI prompts to generate real images</li>
        </ol>
    </div>

    <div class="grid" id="imageGrid"></div>

    <script>
        const images = [
            // Hero & Main
            { name: 'mumbai-daylight.jpg', width: 1920, height: 1080, label: 'Hero - Mumbai Bridge', color: '#6ba3d4' },
            { name: 'mumbai-daylight-800.jpg', width: 800, height: 450, label: 'Hero Mobile', color: '#6ba3d4' },
            { name: 'about-hero.jpg', width: 1920, height: 1080, label: 'About Us Hero', color: '#e89745' },
            { name: 'services-hero.jpg', width: 1920, height: 1080, label: 'Services Hero', color: '#c77a2a' },
            
            // Government Services
            { name: 'gst-registration.jpg', width: 800, height: 600, label: 'GST Registration', color: '#4a7ba7', icon: '📋' },
            { name: 'udyam-msme.jpg', width: 800, height: 600, label: 'MSME Udyam', color: '#5a8fb7', icon: '🏭' },
            { name: 'pan-card.jpg', width: 800, height: 600, label: 'PAN Card', color: '#6a9fc7', icon: '💳' },
            { name: 'passport-services.jpg', width: 800, height: 600, label: 'Passport', color: '#7aafd7', icon: '🛂' },
            { name: 'shop-license.jpg', width: 800, height: 600, label: 'Shop License', color: '#8abfe7', icon: '🏪' },
            { name: 'food-license.jpg', width: 800, height: 600, label: 'Food License', color: '#9acff7', icon: '🍽️' },
            { name: 'income-certificate.jpg', width: 800, height: 600, label: 'Income Cert', color: '#aad0e0', icon: '💰' },
            { name: 'domicile-certificate.jpg', width: 800, height: 600, label: 'Domicile Cert', color: '#bad0f0', icon: '🏠' },
            { name: 'gazette.jpg', width: 800, height: 600, label: 'Gazette', color: '#cae0ff', icon: '📰' },
            { name: 'driving-license.jpg', width: 800, height: 600, label: 'Driving License', color: '#daf0ff', icon: '🚗' },
            { name: 'itr-filing.jpg', width: 800, height: 600, label: 'ITR Filing', color: '#e0f5ff', icon: '📊' },

            // Company
            { name: 'llp-registration.jpg', width: 800, height: 600, label: 'LLP Registration', color: '#d68a2e', icon: '🤝' },
            { name: 'pvt-ltd-company.jpg', width: 800, height: 600, label: 'Pvt Ltd', color: '#e89745', icon: '🏢' },
            { name: 'iso-certificate.jpg', width: 800, height: 600, label: 'ISO Cert', color: '#f5b76e', icon: '✓' },

            // Loans
            { name: 'personal-loan.jpg', width: 800, height: 600, label: 'Personal Loan', color: '#27ae60', icon: '💵' },
            { name: 'business-loan.jpg', width: 800, height: 600, label: 'Business Loan', color: '#2ecc71', icon: '💼' },
            { name: 'home-loan.jpg', width: 800, height: 600, label: 'Home Loan', color: '#3ed17d', icon: '🏡' },
            { name: 'car-loan.jpg', width: 800, height: 600, label: 'Car Loan', color: '#4ed68a', icon: '🚙' },
            { name: 'loan-against-property.jpg', width: 800, height: 600, label: 'LAP', color: '#5edb97', icon: '🏠' },
            { name: 'working-capital.jpg', width: 800, height: 600, label: 'Working Capital', color: '#6ee0a4', icon: '💳' },

            // Insurance
            { name: 'life-insurance.jpg', width: 800, height: 600, label: 'Life Insurance', color: '#e74c3c', icon: '🛡️' },
            { name: 'health-insurance.jpg', width: 800, height: 600, label: 'Health Insurance', color: '#f05545', icon: '⚕️' },
            { name: 'motor-insurance.jpg', width: 800, height: 600, label: 'Motor Insurance', color: '#f96854', icon: '🚗' },
            { name: 'term-insurance.jpg', width: 800, height: 600, label: 'Term Insurance', color: '#ff7b63', icon: '📋' },

            // Travel
            { name: 'bus-booking.jpg', width: 800, height: 600, label: 'Bus Booking', color: '#9b59b6', icon: '🚌' },
            { name: 'car-rental.jpg', width: 800, height: 600, label: 'Car Rental', color: '#a569c6', icon: '🚗' },
            { name: 'tour-packages.jpg', width: 800, height: 600, label: 'Tour Packages', color: '#b579d6', icon: '✈️' },
            { name: 'corporate-travel.jpg', width: 800, height: 600, label: 'Corporate Travel', color: '#c589e6', icon: '💼' },
            { name: 'local-outstation.jpg', width: 800, height: 600, label: 'Local/Outstation', color: '#d599f6', icon: '🚙' },

            // Team & Office
            { name: 'office-reception.jpg', width: 800, height: 600, label: 'Office Reception', color: '#95a5a6' },
            { name: 'team-working.jpg', width: 800, height: 600, label: 'Team Working', color: '#a5b5b6' },
            { name: 'customer-service.jpg', width: 800, height: 600, label: 'Customer Service', color: '#b5c5c6' },
            { name: 'document-processing.jpg', width: 800, height: 600, label: 'Documents', color: '#c5d5d6' },

            // Process
            { name: 'step-consultation.jpg', width: 600, height: 400, label: 'Step 1 - Consult', color: '#3498db' },
            { name: 'step-documentation.jpg', width: 600, height: 400, label: 'Step 2 - Docs', color: '#5dade2' },
            { name: 'step-filing.jpg', width: 600, height: 400, label: 'Step 3 - Filing', color: '#76c2f2' },
            { name: 'step-delivery.jpg', width: 600, height: 400, label: 'Step 4 - Delivery', color: '#8fd7ff' },
        ];

        function createPlaceholder(img) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, img.width, img.height);
            gradient.addColorStop(0, img.color);
            gradient.addColorStop(1, adjustColor(img.color, -20));
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, img.width, img.height);

            // Icon if available
            if (img.icon) {
                ctx.font = `${Math.min(img.width, img.height) * 0.3}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(img.icon, img.width / 2, img.height / 2 - 40);
            }

            // Text
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.font = `bold ${Math.min(img.width, img.height) * 0.08}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(img.label, img.width / 2, img.height / 2 + 40);

            // Dimensions
            ctx.font = `${Math.min(img.width, img.height) * 0.04}px Inter, sans-serif`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText(`${img.width} × ${img.height}`, img.width / 2, img.height / 2 + 70);

            return canvas;
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.max(0, Math.min(255, (num >> 16) + amount));
            const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
            const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
            return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }

        function downloadCanvas(canvas, filename) {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.9);
        }

        // Generate all placeholders
        const grid = document.getElementById('imageGrid');
        images.forEach(img => {
            const card = document.createElement('div');
            card.className = 'card';

            const canvas = createPlaceholder(img);
            card.appendChild(canvas);

            const info = document.createElement('div');
            info.className = 'info';
            info.innerHTML = `
                <h3>${img.label}</h3>
                <p>${img.width} × ${img.height}px</p>
                <button class="btn" onclick="downloadCanvas(this.parentElement.parentElement.querySelector('canvas'), '${img.name}')">
                    Download ${img.name}
                </button>
            `;
            card.appendChild(info);

            grid.appendChild(card);
        });

        // Make downloadCanvas available globally
        window.downloadCanvas = downloadCanvas;
    </script>
</body>
</html>
